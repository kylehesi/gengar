# Gengar ayarları. Kod içinde sabit değer yerine buradan okunur.

[llm]
# Varsayılan profil: aşağıdaki [llm.profiles.*] adlarından biri.
default = "local"
# Sistem promptu (proje köküne göre yol).
system_prompt = "config/prompts/system.md"
# Sohbet geçmişinde tutulan en fazla mesaj (sistem promptu hariç).
max_history_messages = 40
# Yanıt bekleme süresi (saniye).
timeout = 120

# Her profil bir modeldir. "model" alanı LiteLLM formatındadır: "<sağlayıcı>/<model>".
# key_env: o sağlayıcının API anahtarının .env içindeki adı (yerel modelde yok).
# reasoning_effort: "none" düşünmeyi kapatır (hızlı); "low"/"medium"/"high" açar.
#   Belirtilmezse sağlayıcının varsayılanı kullanılır. Sohbette /think ile değişir.
# rpm: dakikada en fazla istek (ücretsiz API katmanları için); yoksa sınırsız.

[llm.profiles.local]
model = "ollama_chat/qwen3:8b"
description = "Yerel Qwen3 8B (Ollama, GPU) — ücretsiz, internetsiz"
reasoning_effort = "none"

# options: sağlayıcıya olduğu gibi iletilen ek parametreler.
[llm.profiles.local.options]
num_ctx = 8192        # bağlam penceresi (token). 8 GB VRAM'de model + 8k rahat sığar.
keep_alive = "30m"    # model 30 dk boyunca VRAM'de kalsın; her soruda yeniden yüklenmesin.

[llm.profiles.local35]
model = "ollama_chat/qwen3.5:9b"
description = "Yerel Qwen3.5 9B (Ollama, GPU) — Qwen3'ün halefi"
reasoning_effort = "none"

[llm.profiles.local35.options]
num_ctx = 8192
keep_alive = "30m"

[llm.profiles.gemini]
# gemini-flash-latest ve en yeni sürümler ücretsiz katmanda sık sık "yoğun" (503) dönüyor;
# 3.5-flash hızlı ve kararlı. Alternatifler: gemini-3.5-flash-lite, gemini-flash-lite-latest
model = "gemini/gemini-3.5-flash"
key_env = "GEMINI_API_KEY"
description = "Google Gemini 3.5 Flash — ücretsiz kota ile geliştirme"
# Ücretsiz katman: dakikada 5 istek. Gengar istekleri buna göre aralıklandırır.
# Ücretli anahtarda bu satırı silin.
rpm = 5

[llm.profiles.deepseek]
model = "deepseek/deepseek-chat"
key_env = "DEEPSEEK_API_KEY"
description = "DeepSeek — çok ucuz, güçlü"

[llm.profiles.openrouter]
model = "openrouter/deepseek/deepseek-chat"
key_env = "OPENROUTER_API_KEY"
description = "OpenRouter — tek anahtarla birçok model"

[llm.profiles.claude-haiku]
model = "anthropic/claude-haiku-5-5"
key_env = "ANTHROPIC_API_KEY"
description = "Claude Haiku — ucuz, araç kullanımında güçlü"

[ollama]
# "localhost" değil: Windows önce IPv6 (::1) dener, Ollama ise IPv4'te dinler;
# bu her istekte ~5 sn gecikme demek.
host = "http://127.0.0.1:11434"
# `gengar doctor` bu modellerin indirilmiş olduğunu kontrol eder.
required_models = ["qwen3:8b", "bge-m3"]

[agent]
# Tek bir istekte modelin en fazla kaç tur araç kullanabileceği.
max_steps = 15
# Düşünme modu: "auto" (karmaşık isteklerde ve bir adım başarısız olunca açılır), "on", "off".
# Sohbette /think on|off|auto ile değişir.
think = "auto"

[code]
# Model yer belirtilmemiş kod projelerini buraya koyar (proje köküne göre).
workspace = "data/workspace"
# run_python'un kullandığı ayrı sanal ortam (Gengar'ın kendi paketlerinden bağımsız).
sandbox_venv = "data/sandbox/.venv"

[ui]
# Düşünme modu açıkken modelin düşünce metni ekrana basılsın mı?
# false: sadece "[düşünüyor…]" göstergesi (sohbette /thinklog ile değişir).
show_thinking = false

[permissions]
# normal: okuma serbest, yazma/sistem eylemleri sorulur
# strict: her şey sorulur
# trust : hiçbir şey sorulmaz — yalnızca test/değerlendirme için!
mode = "normal"

[logs]
# Her eylemin kaydı (JSON Lines). Proje köküne göre yol.
dir = "logs"

[memory]
# Kullanıcı bilgileri ve öğrenilmiş beceriler (SQLite). Proje köküne göre yol.
db = "data/memory.db"
# Anlamsal arama modeli (Ollama). CPU'da çalışır; Qwen3'ü GPU'dan atmasın diye.
embed_model = "bge-m3"
# Zor bir iş başarıyla bitince turdan otomatik beceri çıkarılsın mı? (fazladan bir model çağrısı)
auto_learn = true
# Bir becerinin isteğe "uygun" sayılması için gereken en düşük benzerlik (0-1).
# evals/similarity_calibration.py ölçümü (bge-m3): ilgili istekler ≥ 0.494, alakasızlar ≤ 0.436.
skill_min_score = 0.47
