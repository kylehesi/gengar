[project]
name = "gengar"
version = "0.0.1"
description = "Windows için yerel/API LLM destekli masaüstü asistanı (bitirme projesi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "litellm>=1.105.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pypdf>=6.20.1",
    "trafilatura>=2.3.1",
    "uiautomation>=2.0.29",
]

[project.scripts]
gengar = "gengar.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# winget ile kurulan sistem Python'unu kullan; uv kendi Python'unu indirmesin.
python-preference = "only-system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gengar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
